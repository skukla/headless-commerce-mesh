# Runs only checks that need no credentials, and nothing that deploys.
# The mesh is never created or updated here; `npm run build` only writes mesh.json locally.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Lint, format and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build mesh.json
        run: npm run build
